<div class="w-full contain-content h-full max-w-lg p-6 pt-2 bg-white rounded-lg shadow-lg">
  <button (click)="onCancel()" class="absolute top-2 right-2 text-gray-400 hover:text-gray-600">
    <i class="fas fa-times text-l"></i>
  </button>

  <!-- Document Form -->
  <h2 *ngIf="formType === 'document'" class="mb-2 text-3xl font-bold text-center text-customBlue poppins-bold">Créer un document</h2>
  <form *ngIf="formType === 'document'" class="space-y-1" [formGroup]="documentForm" (ngSubmit)="onSubmit()">
    <div class="flex justify-center mb-4">
      <img src="assets/img/docImage.png" alt="Header Image" class="w-full h-48 bg-cover object-cover">
    </div>
    <div class="form-group mb-1">
      <label class="mb-1" for="title">Nom du document</label>
      <input formControlName="title" type="text" id="title" name="title" placeholder="Nom du Document"
             [ngClass]="{'custom-outline': (documentFormControl['title'].touched || submitted) && documentFormControl['title'].errors}"
             class="w-full px-2 py-1 border rounded-lg focus:outline-none focus:ring-2 focus:ring-customBlue">
      <span class="text-red-600 text-sm" *ngIf="(documentFormControl['title'].touched || submitted) && documentFormControl['title'].errors?.['required']">
        Nom du document requis !
      </span>
    </div>
    <div class="form-group mb-1">
      <label class="mb-1" for="file">Fichier</label>
      <input type="file" id="file" (change)="onFileSelected($event)" placeholder="Selectionner votre document"
             [ngClass]="{'custom-outline': (documentFormControl['file'].touched || submitted) && documentFormControl['file'].errors}"
             class="w-full px-2 py-1 border rounded-lg focus:outline-none focus:ring-2 focus:ring-customBlue">
      <span class="text-red-600 text-sm" *ngIf="(documentFormControl['file'].touched || submitted) && documentFormControl['file'].errors?.['required']">
        Fichier requis !
      </span>
    </div>
    <div class="step">
      <button type="submit" class="w-full mt-2 px-4 py-2 text-white bg-customBlue rounded-lg hover:bg-customBlue-dark disabled:bg-gray-300 disabled:cursor-not-allowed" [disabled]="documentForm.invalid">Créer</button>
    </div>
  </form>

  <!-- Collaborator Form -->
  <h2 *ngIf="formType === 'collaborator'" class="mb-2 text-2xl font-bold text-center text-customBlue poppins-bold">Ajouter un Collaborateur</h2>
  <form *ngIf="formType === 'collaborator'" class="space-y-1" [formGroup]="collaboratorForm" (ngSubmit)="onSubmit()">
    <div class="flex justify-center mb-4">
      <img src="assets/img/colImage2.jpg" alt="Header Image" class="w-full h-52 bg-cover object-cover">
    </div>
    <div class="form-group mb-1">
      <label class="mb-1" for="name">Nom du Collaborateur</label>
      <input formControlName="name" type="text" id="name" name="name" placeholder="Nom du Collaborateur"
             [ngClass]="{'custom-outline': (collaboratorFormControl['name'].touched || submitted) && collaboratorFormControl['name'].errors}"
             class="w-full px-2 py-1 border rounded-lg focus:outline-none focus:ring-2 focus:ring-customBlue">
      <span class="text-red-600 text-sm" *ngIf="(collaboratorFormControl['name'].touched || submitted) && collaboratorFormControl['name'].errors?.['required']">
        Nom du collaborateur requis !
      </span>
    </div>
    <div class="form-group mb-1">
      <label class="mb-1" for="email">Email du Collaborateur</label>
      <input formControlName="email" type="email" id="email" name="email" placeholder="Email du Collaborateur"
             [ngClass]="{'custom-outline': (collaboratorFormControl['email'].touched || submitted) && collaboratorFormControl['email'].errors}"
             class="w-full px-2 py-1 border rounded-lg focus:outline-none focus:ring-2 focus:ring-customBlue">
      <span class="text-red-600 text-sm" *ngIf="(collaboratorFormControl['email'].touched || submitted) && collaboratorFormControl['email'].errors?.['required']">
        Email requis !
      </span>
      <span class="text-red-600 text-sm" *ngIf="(collaboratorFormControl['email'].touched || submitted) && collaboratorFormControl['email'].errors?.['email']">
        Email invalide !
      </span>
    </div>
    <div class="step">
      <button type="submit" class="w-full mt-2 px-4 py-2 text-white bg-customBlue rounded-lg hover:bg-customBlue-dark disabled:bg-gray-300 disabled:cursor-not-allowed" [disabled]="collaboratorForm.invalid">Ajouter</button>
    </div>
  </form>

  <!-- Supervisor Form -->
  <h2 *ngIf="formType === 'supervisor'" class="mb-2 text-2xl font-bold text-center text-customBlue poppins-bold">Ajouter un Superviseur</h2>
  <form *ngIf="formType === 'supervisor'" class="space-y-1" [formGroup]="supervisorForm" (ngSubmit)="onSubmit()">
    <div class="flex justify-center mb-4">
      <img src="assets/img/supervisor.jpg" alt="Header Image" class="w-full h-52 bg-cover object-cover">
    </div>
    <div class="form-group mb-1">
      <label class="mb-1" for="name">Nom du Superviseur</label>
      <input formControlName="name" type="text" id="name" name="name" placeholder="Nom du Superviseur"
             [ngClass]="{'custom-outline': (supervisorFormControl['name'].touched || submitted) && supervisorFormControl['name'].errors}"
             class="w-full px-2 py-1 border rounded-lg focus:outline-none focus:ring-2 focus:ring-customBlue">
      <span class="text-red-600 text-sm" *ngIf="(supervisorFormControl['name'].touched || submitted) && supervisorFormControl['name'].errors?.['required']">
        Nom du superviseur requis !
      </span>
    </div>
    <div class="form-group mb-1">
      <label class="mb-1" for="email">Email</label>
      <input formControlName="email" type="text" id="department" name="department" placeholder="Entre votre adresse email"
             [ngClass]="{'custom-outline': (supervisorFormControl['email'].touched || submitted) && supervisorFormControl['email'].errors}"
             class="w-full px-2 py-1 border rounded-lg focus:outline-none focus:ring-2 focus:ring-customBlue">
      <span class="text-red-600 text-sm" *ngIf="(supervisorFormControl['email'].touched || submitted) && supervisorFormControl['email'].errors?.['required']">
        Email requis !
      </span>
    </div>
    <div class="step">
      <button type="submit" class="w-full mt-2 px-4 py-2 text-white bg-customBlue rounded-lg hover:bg-customBlue-dark disabled:bg-gray-300 disabled:cursor-not-allowed" [disabled]="supervisorForm.invalid">Ajouter</button>
    </div>
  </form>
</div>
