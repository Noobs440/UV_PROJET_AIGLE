<div *ngIf="show" [ngClass]="{
  'bg-green-100 border-green-400 text-green-700': type === 'success',
  'bg-red-100 border-red-400 text-red-700': type === 'error',
  'bg-blue-100 border-blue-400 text-blue-700': type === 'info'

} " class="border px-4 py-3 rounded relative mb-2 flex items-center justify-between">
  <span class="block">{{ message }}</span>
  <button (click)="close()" class="ml-4 text-lg font-bold focus:outline-none">&times;</button>
</div>
