<div class="edit-email-container">
  <h2>Modifier mon adresse email</h2>

  <form (ngSubmit)="updateEmail(emailForm)" #emailForm="ngForm" novalidate>
    <div class="form-group">
      <label for="email">Nouvel email</label>
      <input
        id="email"
        name="email"
        type="email"
        [(ngModel)]="email"
        required
        email
        class="form-control"
        placeholder="Entrez votre nouvel email"
        [class.is-invalid]="emailForm.submitted && emailForm.controls['email']?.invalid" />
      <div *ngIf="emailForm.submitted && emailForm.controls['email']?.errors" class="invalid-feedback">
        <div *ngIf="emailForm.controls['email']?.errors?.['required']">
          L'adresse email est obligatoire.
        </div>
        <div *ngIf="emailForm.controls['email']?.errors?.['email']">
          Veuillez entrer une adresse email valide.
        </div>
      </div>
    </div>

    <button type="submit" class="btn btn-primary mt-2">
      Mettre à jour
    </button>
  </form>

  <div *ngIf="message" class="alert alert-success mt-3">
    {{ message }}
  </div>

  <div *ngIf="error" class="alert alert-danger mt-3">
    {{ error }}
  </div>
</div>
